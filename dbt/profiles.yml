# No secrets in here (DuckDB is a local file + the delta plugin reads
# local paths only), safe to commit -- unlike infra/oci's backend.hcl.
spb_pipeline:
  target: prod
  outputs:
    prod:
      type: duckdb
      path: /home/ubuntu/spb_gold.duckdb
      plugins:
        - module: delta
    # Local-only target for testing against the docker-compose MinIO
    # stand-in directly over S3 -- no OCI account, PAR, or instance
    # principal needed. Nothing on the real instance uses this (that
    # always targets prod); safe to commit since these are MinIO's
    # well-known local dev defaults (docker-compose.yml), not real
    # credentials. The `settings` below configure DuckDB's own httpfs --
    # they do NOT reach the delta plugin (deltalake/delta-rs has its own,
    # separate S3 credential chain), so the delta-rs side also needs
    # AWS-shaped env vars set before invoking dbt:
    #   AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
    #   AWS_ENDPOINT_URL=http://localhost:9000 AWS_ALLOW_HTTP=true AWS_REGION=us-east-1 \
    #   dbt build --target dev --vars '{lakehouse_sync_dir: s3://san-pedro-bay-lakehouse}'
    dev:
      type: duckdb
      path: dev_gold.duckdb
      extensions:
        - httpfs
      plugins:
        - module: delta
      settings:
        s3_endpoint: "localhost:9000"
        s3_access_key_id: "minioadmin"
        s3_secret_access_key: "minioadmin"
        s3_url_style: "path"
        s3_use_ssl: "false"
