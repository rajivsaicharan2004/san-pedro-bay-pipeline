name: Validate geofences

on:
  push:
    paths:
      - "processing/geofences/**"
      - ".github/workflows/validate-geofences.yml"
  pull_request:
    paths:
      - "processing/geofences/**"
      - ".github/workflows/validate-geofences.yml"

jobs:
  validate-zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install shapely

      - name: Validate zones.geojson
        run: python processing/geofences/validate_zones.py
